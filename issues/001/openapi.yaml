openapi: 3.1.0
info:
  title: Throwtrash Schedule Search API
  version: 0.1.0
  description: |
    住所または郵便番号から自治体のゴミ出し予定を調査し、正規化JSONで返すAPI。
    バックエンドはCodex Execで公開情報を調査するため、応答に30秒以上かかる場合があります。
    API Gateway REST API response streamingを使用しますが、クライアントへ返るbodyは通常のJSON 1件です。
servers:
  - url: https://qen9imrbw7.execute-api.ap-northeast-1.amazonaws.com/prod
    description: Deployed dev endpoint
paths:
  /search:
    post:
      operationId: searchTrashSchedule
      summary: ゴミ出し予定を検索する
      description: |
        `address` または `postal_code` のいずれかを指定します。
        両方が指定された場合、バックエンドは `address` を優先します。
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
            examples:
              address:
                summary: 住所で検索
                value:
                  address: 東京都新宿区西新宿2丁目
              postalCode:
                summary: 郵便番号で検索
                value:
                  postal_code: "160-0023"
      responses:
        "200":
          description: ゴミ出し予定の検索に成功した場合、または対象地域の予定を特定できないがAPI処理自体は正常に完了した場合。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrashResponse"
              examples:
                success:
                  summary: 予定を特定できた場合
                  value:
                    trashes:
                      - type: resource
                        schedule:
                          - type: weekday
                            value: "4"
                      - type: burn
                        schedule:
                          - type: weekday
                            value: "3"
                          - type: weekday
                            value: "6"
                      - type: unburn
                        schedule:
                          - type: biweek
                            value: "1-1"
                          - type: biweek
                            value: "1-3"
                    error_type: ""
                noResult:
                  summary: 住所に対応する予定を特定できない場合
                  value:
                    trashes: []
                    message: 指定された住所に対応するゴミ出し予定を特定できませんでした。
                    error_type: invalid_address
                invalidPostalCode:
                  summary: 郵便番号に対応する予定を特定できない場合
                  value:
                    trashes: []
                    message: 指定された郵便番号に対応するゴミ出し予定を特定できませんでした。
                    error_type: invalid_postalcode
                unsupportedSchedule:
                  summary: 対応外の日程形式だった場合
                  value:
                    trashes:
                      - type: burn
                        schedule:
                          - type: weekday
                            value: "2"
                    message: 一部のゴミ出し予定に対応していないため、対応可能な予定のみ返しています。
                    error_type: unsupported_schedule
        "400":
          description: "リクエストJSONが不正、または `address` と `postal_code` がどちらも未指定。"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missingInput:
                  value:
                    trashes: []
                    message: 住所または郵便番号を指定してください。
                    error_type: unknown
                malformedJson:
                  value:
                    trashes: []
                    message: リクエストJSONが不正です。
                    error_type: unknown
        "403":
          description: API keyが未指定、または無効。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayErrorResponse"
              example:
                message: Forbidden
        "405":
          description: HTTPメソッドがPOSTではない。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                trashes: []
                message: HTTPメソッドはPOSTを指定してください。
                error_type: unknown
        "415":
          description: "Content-Typeが `application/json` ではない。"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                trashes: []
                message: Content-Type は application/json を指定してください。
                error_type: unknown
        "429":
          description: API Gateway usage planのレート制限を超過。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayErrorResponse"
              example:
                message: Too Many Requests
        "500":
          description: 予期しないサーバーエラー。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                trashes: []
                message: ゴミ出し予定の調査中に予期しないエラーが発生しました。
                error_type: unknown
        "502":
          description: Codex Execの失敗、Codexの出力をAPIレスポンスとして検証できない、またはCodexが予期しないエラーに分類した。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                codexFailed:
                  value:
                    trashes: []
                    message: ゴミ出し予定の調査に失敗しました。
                    error_type: unknown
                invalidCodexResult:
                  value:
                    trashes: []
                    message: ゴミ出し予定の解析結果を検証できませんでした。
                    error_type: unknown
                codexClassifiedUnknown:
                  value:
                    trashes: []
                    message: ゴミ出し予定の調査中に予期しないエラーが発生しました。
                    error_type: unknown
        "504":
          description: Codex ExecがAPIのタイムアウト内に完了しない。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                trashes: []
                message: ゴミ出し予定の調査がタイムアウトしました。
                error_type: unknown
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
  schemas:
    SearchRequest:
      type: object
      description: |
        `address` または `postal_code` のいずれかを指定します。
        両方指定された場合は `address` が優先されます。
      properties:
        address:
          type: string
          minLength: 1
          description: 住所。都道府県、市区町村、町名、丁目など。
          examples:
            - 東京都新宿区西新宿2丁目
        postal_code:
          type: string
          minLength: 1
          description: 郵便番号。ハイフン有無は問わず文字列として送信します。
          examples:
            - "160-0023"
      anyOf:
        - required: [address]
        - required: [postal_code]
    TrashResponse:
      type: object
      required: [trashes, error_type]
      properties:
        trashes:
          type: array
          items:
            $ref: "#/components/schemas/TrashItem"
        message:
          type: string
          description: ゴミ出し予定が見つからない場合や特定できない場合の理由。
        error_type:
          $ref: "#/components/schemas/ErrorType"
      additionalProperties: false
    ErrorResponse:
      type: object
      required: [trashes, message, error_type]
      properties:
        trashes:
          type: array
          maxItems: 0
          items:
            $ref: "#/components/schemas/TrashItem"
        message:
          type: string
        error_type:
          $ref: "#/components/schemas/ErrorType"
      additionalProperties: false
    ErrorType:
      type: string
      description: |
        クライアント向けエラー識別子。全て正常な場合は空文字。
        `unsupported_schedule` は部分成功を表し、特定できた `trashes` は返されます。
      enum:
        - ""
        - invalid_address
        - invalid_postalcode
        - unsupported_schedule
        - unknown
    GatewayErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
      additionalProperties: true
    TrashItem:
      type: object
      required: [type, schedule]
      properties:
        type:
          $ref: "#/components/schemas/TrashType"
        trash_name:
          type: string
          description: "`type` が `other` の場合のみ返される具体的なゴミ種別名。"
        schedule:
          type: array
          items:
            $ref: "#/components/schemas/TrashSchedule"
      additionalProperties: false
    TrashType:
      type: string
      enum:
        - burn
        - unburn
        - resource
        - plastic
        - bin
        - can
        - petbottle
        - coarse
        - paper
        - other
      description: |
        ゴミ種別。
        `burn`: 燃えるゴミ。
        `unburn`: 燃えないゴミ。
        `resource`: 資源ゴミ。
        `plastic`: プラスチック。
        `bin`: ビン。
        `can`: カン。
        `petbottle`: ペットボトル。
        `coarse`: 粗大ゴミ。
        `paper`: 古紙。
        `other`: その他。
    TrashSchedule:
      type: object
      required: [type, value]
      properties:
        type:
          $ref: "#/components/schemas/ScheduleType"
        value:
          oneOf:
            - type: string
              description: "`weekday`, `biweek`, `unsupported` の値。"
            - type: integer
              minimum: 1
              maximum: 31
              description: "`month` の日付値。"
            - $ref: "#/components/schemas/EvweekValue"
      additionalProperties: false
    ScheduleType:
      type: string
      enum:
        - weekday
        - biweek
        - month
        - evweek
        - unsupported
      description: |
        日程種別。
        `weekday`: 毎週。`value` は曜日番号の文字列。0=日, 1=月, 2=火, 3=水, 4=木, 5=金, 6=土。
        `biweek`: 第N曜日。`value` は `<曜日番号>-<週番号>` 形式の文字列。
        `month`: 毎月特定日。`value` は1から31の数値。
        `evweek`: 隔週またはN週間ごと。`value` は `EvweekValue`。
        `unsupported`: 分類できない日程。`value` は元の日程テキスト。
    EvweekValue:
      type: object
      required: [weekday, interval, start_date]
      properties:
        weekday:
          type: integer
          minimum: 0
          maximum: 6
          description: 曜日番号。0=日曜日、6=土曜日。
        interval:
          type: integer
          minimum: 2
          description: 何週間ごとかを表す数値。
        start_date:
          type: string
          format: date
          description: 隔週計算の開始日。YYYY-MM-DD形式。
      additionalProperties: false
